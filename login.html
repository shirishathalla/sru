<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
            text-align: center;
        }

        h1 {
            color: darkblue;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 6px;
        }

        button {
            width: 97%;
            padding: 12px;
            margin-top: 15px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }

        p {
            margin-top: 20px;
        }

        a {
            color: darkblue;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form>
            <input type="text" placeholder="Username" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</body>
</html>
